# safe-browser configuration
# Copy to ~/.config/safe-browser/config.yaml

model:
  # Available: "promptguard", "browsesafe", "gpt-safeguard", "rules"
  # promptguard: DeBERTa / Llama-Prompt-Guard fallback chain (default, public)
  # browsesafe: perplexity-ai/browsesafe (public, no auth)
  # gpt-safeguard: openai/gpt-oss-safeguard-20b (gated, requires HF token)
  # rules: rule-based only, no model download
  name: "promptguard"
  device: "cpu"  # "cuda", "mps" for Apple Silicon
  fail_closed: true  # Treat as suspicious when model fails

adapter:
  # Input format adapter: "auto", "camoufox", "agent_browser", "raw"
  # auto: detect format from content (default)
  # camoufox: parse camoufox snapshot JSON
  # agent_browser: parse agent-browser accessibility tree JSON
  # raw: plain text passthrough
  default: "auto"

thresholds:
  block: 0.9    # score >= this -> malicious
  caution: 0.5  # score >= this -> suspicious

rules:
  enabled: true
  custom_patterns: []
  # Example custom pattern:
  # - name: "my_rule"
  #   pattern: "(?i)some pattern"
  #   severity: "high"

logging:
  level: "WARNING"
