[project]
name = "safe-browser"
version = "1.0.0"
description = "Screen browser content for prompt injection attacks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Clawd Brunner", email = "clawd@chrisbrunner.com" },
]
keywords = ["prompt-injection", "browser-security", "ai-safety", "content-screening"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "transformers>=4.40",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
safe-browser = "safe_browser.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safe_browser"]
